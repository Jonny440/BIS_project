<main>
  <h1>Dashboard</h1>
  <p>Hello, {{ user()?.fullName }}.</p>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <h2>To-do list</h2>

  <form class="add-task" (submit)="$event.preventDefault(); add()">
    <input
      type="text"
      placeholder="New task"
      [value]="title()"
      (input)="title.set($any($event.target).value)"
    />
    <input
      type="date"
      [value]="deadline()"
      (input)="deadline.set($any($event.target).value)"
    />
    <select [value]="priority()" (change)="priority.set($any($event.target).value)">
      <option value="HIGH">High</option>
      <option value="MEDIUM">Medium</option>
      <option value="LOW">Low</option>
    </select>
    <button type="submit" [disabled]="busy()">Add task</button>
  </form>

  @if (tasks(); as list) {
    <table>
      <thead>
        <tr>
          <th>Task</th>
          <th>Deadline</th>
          <th>Priority</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (t of list; track t.id) {
          <tr [class.is-done]="t.done">
            <td>{{ t.title }}</td>
            <td>{{ t.dueDate }}</td>
            <td [attr.data-priority]="t.priority">{{ t.priority }}</td>
            <td>
              <button type="button" (click)="toggle(t)">{{ t.done ? 'Undo' : 'Done' }}</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  } @else if (!error()) {
    <p>Loading…</p>
  }
</main>
